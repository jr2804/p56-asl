name: ci

on:
  push:
    branches:
    - main
    - test-me-*
  pull_request:
    branches:
    - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8
  PYTHONWARNDEFAULTENCODING: "1"

jobs:

  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: false

    - name: Install CI tools
      run: |
        for i in 1 2 3; do
          if mise install; then
            break
          elif [ "$i" = 3 ]; then
            exit 1
          fi
          echo "mise install failed (attempt $i), retrying in 30s"
          sleep 30
        done

    - name: Install dependencies
      run: mise dev

    - name: Run linter
      run: mise lint

    - name: Check spelling
      run: mise spell

  tests:
    needs:
    - quality
    strategy:
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        python-version:

        - "3.13"
        - "3.14"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: false

    - name: Install CI tools
      run: |
        for i in 1 2 3; do
          if mise install; then
            break
          elif [ "$i" = 3 ]; then
            exit 1
          fi
          echo "mise install failed (attempt $i), retrying in 30s"
          sleep 30
        done

    - name: Install dependencies
      run: mise dev

    - name: Run tests with coverage
      run: mise test

  # Documentation build (optional)
  docs:
    needs:
    - quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: false

    # Docs job only needs uv — no mise tools required.
    - name: Install dependencies
      run: mise dev

    - name: Build docs
      run: mise docs
