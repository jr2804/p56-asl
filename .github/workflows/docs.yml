name: docs

on:
  push:
    branches:
    - main
    paths:
    - 'docs/**'
    - 'src/**'
    - 'mkdocs.yml'
    - 'README.md'
    - 'scripts/gen_extended_mode_figure.py'
    - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  LANG: en_US.utf-8
  LC_ALL: en_US.utf-8
  PYTHONIOENCODING: UTF-8

jobs:

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml

    - name: Setup mise
      uses: jdx/mise-action@v2
      with:
        install: true

    - name: Install dependencies (builds the native extension)
      run: mise dev

    - name: Build documentation site
      run: mise docs

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: site/

    - id: deployment
      uses: actions/deploy-pages@v4