name: release

on:
  push:
    branches:
      - main
    # Release only when the wheel would change (Rust/Python source, build
    # config, or this workflow). Docs-only commits skip the release.
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:

  # Compute the calendar version and push the release tag (existing scheme).
  version:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next calendar version
        id: version
        run: |
          set -euo pipefail

          # Accept both padded (2026.09.1) and unpadded (2026.9.1) tags on HEAD.
          existing_head_tag="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$existing_head_tag" ]; then
            echo "version=$existing_head_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          year="$(date -u +%Y)"
          # Unpadded month: Cargo semver rejects leading zeros (2026.09.1 is
          # invalid, 2026.9.1 is valid), and PEP 440 accepts both.
          month="$(date -u +%-m)"

          git fetch --tags --force

          prefix="${year}.${month}."
          padded_prefix="${year}.0${month}."
          highest="$(
            { git tag --list "${padded_prefix}*" "${prefix}*"; } \
              | sed -nE "s/^${year}\\.(0)?${month}\\.([0-9][0-9]*)$/\\2/p" \
              | sort -n | tail -n 1
          )"
          counter="${highest:-0}"
          next="$((counter + 1))"
          version="${year}.${month}.${next}"

          while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
            next="$((next + 1))"
            version="${year}.${month}.${next}"
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "tag ${version} already exists, skipping"
            exit 0
          fi
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

  # Native wheels: {Linux x86_64, Windows x64, macOS arm64} x {3.13, 3.14, 3.14t}.
  # 3.13t is intentionally omitted: pyo3 0.29 (current pin) supports free-threaded
  # builds only on Python 3.14+. Drop 3.14t here when bumping pyo3 to a version
  # that drops free-threaded support.
  wheels:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13", "3.14", "3.14t"]
    name: wheel ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Stamp release version into Cargo.toml
        run: |
          version="${{ needs.version.outputs.version }}"
          # Normalize to Cargo-valid semver (strip month padding, e.g. 09 -> 9).
          version="${version%%.*}.$((10#$(echo "$version" | cut -d. -f2))).${version##*.}"
          # Replace WHATEVER version is committed (main carries the last
          # released version since the stamp-back step) and assert the stamp
          # landed — a silent no-op ships mislabeled wheels.
          current="$(sed -nE 's/^version = "([^"]*)"\r?$/\1/p' Cargo.toml | head -n1)"
          sed -i.bak "s/^version = \"${current}\"/version = \"${version}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${version}\"[[:space:]]*$" Cargo.toml

      # Inside the manylinux container the runner's setup-python is not
      # mounted; the container ships /opt/python/cpXY-cpXYt interpreters
      # instead. The trailing `t` selects the free-threaded build.
      - name: Resolve interpreter
        id: interp
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            py="python${{ matrix.python-version }}"
          else
            py="python"
          fi
          echo "interpreter=$py" >> "$GITHUB_OUTPUT"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --interpreter ${{ steps.interp.outputs.interpreter }} --out dist
          sccache: true
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # Source distribution (one, from Linux).
  sdist:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp release version into Cargo.toml
        run: |
          version="${{ needs.version.outputs.version }}"
          version="${version%%.*}.$((10#$(echo "$version" | cut -d. -f2))).${version##*.}"
          current="$(sed -nE 's/^version = "([^"]*)"\r?$/\1/p' Cargo.toml | head -n1)"
          sed -i.bak "s/^version = \"${current}\"/version = \"${version}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${version}\"[[:space:]]*$" Cargo.toml

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Attach all artifacts to the GitHub release; publish to PyPI when a token exists.
  publish:
    needs: [version, wheels, sdist]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # OIDC token for PyPI trusted publishing (no API-token secret needed).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

      # One-time cleanup: delete padded-month legacy tags. p56-asl tagged
      # #2026.09.1 ... #2026.09.13 before the workflow's CalVer logic settled
      # on the unpadded format (#2026.9.N). Both refer to the same SHAs for
      # #2026.09.7, but the rest (e.g. #2026.09.10 ... #2026.09.13) have no
      # unpadded counterpart. After this run the unpadded format is canonical.
      # Idempotent: re-running on a repo that has none returns cleanly.
      # NOTE: GitHub Release pages for the deleted tags become orphaned but
      # remain addressable by URL (releases/<id>). They are not auto-deleted.
      - name: Delete legacy padded-month tags
        if: github.event_name == 'push'  # safety: only auto-clean on push-to-main, not on workflow_dispatch replays
        run: |
          set -euo pipefail
          year="$(date -u +%Y)"
          # Padded-month tags: e.g. 2026.09.1, 2026.09.13. We only delete tags
          # for the CURRENT year+month (to avoid wiping historical artefacts
          # from older projects if this workflow is ever copied elsewhere).
          legacy="$(git ls-remote --tags origin \
            | awk '{ sub(/"\n/, ""); print $2 }' \
            | grep -E "^refs/tags/${year}\.0[1-9]\.[0-9]+$" \
            | sed 's#^refs/tags/##' || true)"
          if [ -z "$legacy" ]; then
            echo "No legacy padded-month tags to delete for ${year}."
            exit 0
          fi
          echo "Deleting legacy tags:"
          printf '  %s\n' $legacy
          for tag in $legacy; do
            git push origin ":refs/tags/${tag}"
          done

      # Stamp the released version back into main so `uv add git+...` from
      # HEAD reports the real version, not 0.0.0 (the per-job stamps above
      # only exist in throwaway runner checkouts). GITHUB_TOKEN pushes do
      # not re-trigger workflows, so this cannot loop.
      - name: Stamp version back to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ needs.version.outputs.version }}"
          version="${version%%.*}.$((10#$(echo "$version" | cut -d. -f2))).${version##*.}"
          current="$(sed -nE 's/^version = "([^"]*)"\r?$/\1/p' Cargo.toml | head -n1)"
          if [ "$current" = "$version" ]; then
            echo "Cargo.toml already at $version, nothing to stamp"
            exit 0
          fi
          sed -i.bak "s/^version = \"${current}\"/version = \"${version}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${version}\"[[:space:]]*$" Cargo.toml
          git add Cargo.toml
          git commit -m "chore(release): stamp $version"
          git push origin main

      # Trusted publishing (OIDC): PyPI verifies this workflow run's identity
      # via the pending publisher configured at
      # pypi.org/manage/account/publishing/ (owner jr2804, repo p56-asl,
      # workflow release.yml, environment empty).
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
