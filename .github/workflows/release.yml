name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:

  # Compute the calendar version and push the release tag (existing scheme).
  version:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next calendar version
        id: version
        run: |
          set -euo pipefail

          # Accept both padded (2026.09.1) and unpadded (2026.9.1) tags on HEAD.
          existing_head_tag="$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' | head -n 1 || true)"
          if [ -n "$existing_head_tag" ]; then
            echo "version=$existing_head_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          year="$(date -u +%Y)"
          # Unpadded month: Cargo semver rejects leading zeros (2026.09.1 is
          # invalid, 2026.9.1 is valid), and PEP 440 accepts both.
          month="$(date -u +%-m)"

          git fetch --tags --force

          prefix="${year}.${month}."
          highest="$(git tag --list "${prefix}*" | sed -n "s/^${year}\\.${month}\\.\\([0-9][0-9]*\\)$/\\1/p" | sort -n | tail -n 1)"
          counter="${highest:-0}"
          next="$((counter + 1))"
          version="${year}.${month}.${next}"

          while git rev-parse -q --verify "refs/tags/${version}" >/dev/null; do
            next="$((next + 1))"
            version="${year}.${month}.${next}"
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "tag ${version} already exists, skipping"
            exit 0
          fi
          git tag -a "$version" -m "Release $version"
          git push origin "$version"

  # Native wheels: {Windows, Linux, macOS (arm64 + Intel)} x {3.13, 3.14} x {GIL, free-threaded}.
  wheels:
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15]
        python-version: ["3.13", "3.14"]
        freethreaded: [false, true]
    name: wheel ${{ matrix.os }} py${{ matrix.python-version }}${{ matrix.freethreaded && 't' || '' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          freethreaded: ${{ matrix.freethreaded }}

      - name: Stamp release version into Cargo.toml
        run: |
          version="${{ needs.version.outputs.version }}"
          # Normalize to Cargo-valid semver (strip month padding, e.g. 09 -> 9).
          version="${version%%.*}.$((10#$(echo "$version" | cut -d. -f2))).${version##*.}"
          sed -i.bak "s/^version = \"0\\.0\\.0\"/version = \"${version}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep '^version' Cargo.toml

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --interpreter python --out dist
          sccache: true
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}${{ matrix.freethreaded && 't' || '' }}
          path: dist/*.whl
          if-no-files-found: error

  # Source distribution (one, from Linux).
  sdist:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp release version into Cargo.toml
        run: |
          version="${{ needs.version.outputs.version }}"
          version="${version%%.*}.$((10#$(echo "$version" | cut -d. -f2))).${version##*.}"
          sed -i.bak "s/^version = \"0\\.0\\.0\"/version = \"${version}\"/" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Attach all artifacts to the GitHub release; publish to PyPI when a token exists.
  publish:
    needs: [version, wheels, sdist]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

      # Runs only after the PYPI_API_TOKEN secret is configured on the repo
      # (Settings → Secrets and variables → Actions). Until then wheels are
      # attached to the GitHub release only.
      - name: Publish to PyPI
        if: env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
