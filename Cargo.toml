[package]
name = "p56-asl-core"
version = "2026.9.7"
edition = "2021"
description = "Extended ITU-T Rec. P.56 Active Speech Level (ASL) core, Rust implementation"
license = "MIT"
rust-version = "1.85"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.29"
pyo3 = "0.29"
rubato = { version = "0.16.2", default-features = false, features = ["fft_resampler"] }
thiserror = "2"

# Lint baseline for numeric/DSP cores (rust-pyo3-bindings §4 / rust-dsp-stack):
# forbid unsafe, pedantic + nursery as warnings, downgrade the clippy
# suggestions that would change floating-point results or fight DSP idioms.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# rewrites change floating-point results (bit-exactness):
suboptimal_flops = "allow"
imprecise_flops = "allow"
manual_midpoint = "allow"
manual_clamp = "allow"
while_float = "allow"
# exact float comparisons against spec constants are intentional:
float_cmp = "allow"
# casts are pervasive in DSP index/buffer math:
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
# spec constants copied verbatim from reference documents:
unreadable_literal = "allow"
excessive_precision = "allow"
# errors convert to PyErr at the PyO3 boundary; doc churn adds nothing there:
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# stylistic noise on a numeric core (names mirror the reference C impl):
missing_const_for_fn = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
struct_field_names = "allow"
map_unwrap_or = "allow"
# fixed-size stack buffers are normal in DSP code:
large_stack_arrays = "allow"

# extension-module must not be enabled for `cargo test`; maturin enables it
# when building the actual extension (see [tool.maturin] in pyproject.toml).
[features]
default = []
extension-module = ["pyo3/extension-module"]

[profile.release]
# Keep numeric results deterministic across builds (no fast-math style opts)
lto = true
