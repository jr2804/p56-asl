# mise configuration
# Task definitions are in conf.d/*.toml files (automatically loaded by mise)
[tools]
# basic frameworks that should always be available
node = "latest"
bun = "latest"

# Linter/formatter/type checker tools
"ruff" = "latest"
"ty" = "latest"
"rumdl" = "latest"
"pipx:undersort" = "latest"
"pipx:codespell" = "latest"

# CLI tools rg and tree-cli -> use `rg --files | tree-cli --fromfile` to get a nice tree view of the project files
ripgrep = "latest"
"github:peteretelej/tree" = { version = "latest", rename_exe = "tree-cli" }
cargo-dist = "latest"
cargo-make = "latest"
rust = "latest"
"pipx:sloppylint" = "latest"
"pipx:ai-slop-detector" = "latest"
"npm:@yuvrajangadsingh/vibecheck" = "latest"
"npm:aislop" = "latest"
"github:djinn-soul/CytoScnPy" = "latest"
"github:ChuprinaDaria/Vibecode-Cleaner-Fartrun" = "latest"
"github:yoanbernabeu/grepai" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"pipx:repowise" = "latest"
"github:1broseidon/ketch" = "latest"
"github:AlmogBaku/debug-skill" = "latest"
"github:rtk-ai/rtk" = "latest"
"github:gastownhall/beads" = "latest"
"github:dolthub/dolt" = "latest"
"pipx:beads-mcp" = "latest"
"github:Dicklesworthstone/franken_ocr" = "v0.7.2"

[settings.npm]
package_manager = "bun"

[settings.pipx]
uvx = true
