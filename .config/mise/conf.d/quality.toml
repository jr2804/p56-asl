[tasks.test]
description = "Run tests with coverage"
run = "uv run pytest --cov=p56_asl"
sources = ["src/**/*.py", "tests/**/*.py"]
outputs = ["htmlcov/", ".coverage"]

[tasks.all]
description = "Run all quality checks"
depends = [
  "test",
  "lint",
  "spell",
  "format",
  "format-md",
  "docs",
  "cargo-test",
  "cargo-lint",
  "cargo-fmt-check",
]

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf build dist *.egg-info .pytest_cache .coverage htmlcov docs/_build"]
