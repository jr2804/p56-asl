# CI-only mise config — subset of tools needed for GitHub Actions.
# The main config.toml includes agent dev tools (aislop, beads, ketch,
# etc.) that pull from codeberg/npm/github and timeout on runners.
[tools]
rust = "latest"
ruff = "latest"
ty = "latest"
rumdl = "latest"
cargo-dist = "latest"
cargo-make = "latest"
"pipx:codespell" = "latest"
