[project]
name = "p56-asl"
dynamic = ["version"]
description = "An extended version of the ITU-T Rec. P.56 Active Speech Level (ASL). Complies with reference C-implementation but re-implemented in Rust and MIT-licensed. "
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "Jan.Reimes@head-acoustics.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typer>=0.12.0",
    "numpy>=1.26",
    "soundfile"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "maturin>=1.7,<2.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.29",
    "markdown-exec>=1.8",
    "markdown-callouts>=0.4",
    "ghp-import>=2.1",
    "scipy>=1.18.0",
    "xy>=0.0.6",
]

[project.scripts]
p56-asl = "p56_asl.cli.app:main"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

# Rust core → compiled extension `p56_asl._native`; Python package lives in
# src/p56_asl (python-source) alongside the Rust sources (src/*.rs).
[tool.maturin]
python-source = "src"
module-name = "p56_asl._native"
features = ["extension-module"]
include = ["Cargo.toml", "src/**/*.rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
addopts = "-v --tb=short"

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.coverage.run]
source = ["p56_asl"]

[tool.codespell]
skip = "*.git,*.svg,*.lock,*.min.js,*.min.css"
check-hidden = true
ignore-words-list = "crate,ser,fpr,nd,fo,ba,te"
ignore-regex = "https?://|\b[A-Z]+\b"

[tool.undersort]
# Method visibility ordering: public (no underscore), protected (single underscore), private (double underscore)
order = ["public", "protected", "private"]
# Method type ordering within each visibility level
method_type_order = ["instance", "class", "static"]
